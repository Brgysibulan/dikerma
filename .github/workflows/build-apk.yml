name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Verify APK remains offline-only
        shell: bash
        run: |
          if grep -R --include='AndroidManifest.xml' -n 'android.permission.INTERNET' app/build/intermediates 2>/dev/null; then
            echo "ERROR: INTERNET permission appeared in a merged Android manifest."
            exit 1
          fi
          echo "Offline-only check passed: no INTERNET permission in merged manifests."

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BarangayIDMaker-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
